name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Edge Functions prüfen (Deno)
        working-directory: supabase/functions
        run: deno check --node-modules-dir=none --no-config act/index.ts accept-invite/index.ts
